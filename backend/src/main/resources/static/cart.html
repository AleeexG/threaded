<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Your Cart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
            color: black;
        }

        .container {
            padding: 30px;
            max-width: 900px;
            margin: 30px auto;
            background: white;
            border-radius: 12px;
            border: 3px solid #ff7ebf;
        }

        h2 {
            margin-top: 0;
            font-size: 32px;
            font-weight: 700;
        }

        .cart-item {
            display: flex;
            align-items: center;
            padding: 15px 0;
            border-bottom: 2px solid #eee;
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid black;
            margin-right: 20px;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-size: 20px;
            font-weight: 700;
        }

        .item-price {
            font-size: 18px;
            font-weight: 600;
            margin-top: 5px;
        }

        .remove-btn {
            background: #ff7ebf;
            color: black;
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid black;
            cursor: pointer;
            font-weight: 600;
        }

        .remove-btn:hover {
            background: #333;
        }

        .total {
            text-align: right;
            font-size: 24px;
            font-weight: 700;
            margin-top: 20px;
        }

        .checkout-btn {
            display: block;
            margin-left: auto;
            margin-top: 20px;
            padding: 14px 22px;
            background: #ff7ebf;
            border: 2px solid black;
            border-radius: 10px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            color: black;
        }

        .checkout-btn:hover {
            background: #ff9ad0;
        }

        .empty {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            color: #ff7ebf;
            margin-top: 80px;
        }

        .address-section {
            margin-top: 30px;
            padding: 20px;
            border: 2px solid black;
            border-radius: 10px;
        }

        .address-section h3 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
        }

        .address-field {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            font-size: 16px;
            border: 2px solid black;
            border-radius: 8px;
        }

        .address-row {
            display: flex;
            gap: 15px;
            width: 100%;
        }

        .address-row .address-field {
            flex: 1;
        }

        @media (max-width: 600px) {
            .address-row {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="/responsive.css">

</head>
<body>

<div id="navbar"></div>

<div class="container">
    <h2>Your Cart</h2>
    <div id="cartItems"></div>
    <div id="total" class="total"></div>

    <div class="address-section">
        <h3>Delivery Address</h3>

        <input id="fullName" class="address-field" type="text" placeholder="Full Name">
        <input id="line1" class="address-field" type="text" placeholder="Address Line 1">
        <input id="line2" class="address-field" type="text" placeholder="Address Line 2 (optional)">

        <div class="address-row">
            <input id="city" class="address-field" type="text" placeholder="City">
            <input id="postcode" class="address-field" type="text" placeholder="Postcode">
        </div>
    </div>

    <button id="checkoutBtn" class="checkout-btn" onclick="checkout()">Checkout</button>
</div>

<script>
let dark = localStorage.getItem("darkMode") === "true";

function applyDarkModeState() {
    document.body.classList.toggle("dark-mode", dark);
    updateIcons(dark);
}

function updateIcons(isDark) {
    const desktopIcon = document.getElementById("desktopIcon");
    const mobileIcon = document.getElementById("mobileIcon");
    const desktopText = document.querySelector("#darkToggleDesktop span");

    if (!desktopIcon || !mobileIcon || !desktopText) return;

    if (isDark) {
        desktopIcon.innerHTML =
            '<path d="M12 4V2M12 22v-2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12H4M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="5"/>';
        mobileIcon.innerHTML = desktopIcon.innerHTML;
        desktopText.textContent = "Day";
    } else {
        desktopIcon.innerHTML =
            '<path d="M21 12.79A9 9 0 0111.21 3 7 7 0 1019 14.79z"/>';
        mobileIcon.innerHTML = desktopIcon.innerHTML;
        desktopText.textContent = "Night";
    }
}

function toggleDark() {
    dark = !dark;
    localStorage.setItem("darkMode", dark);
    applyDarkModeState();
}

async function loadNavbar() {
    const nav = document.getElementById("navbar");
    nav.style.display = "none";

    const res = await fetch("/navbar.html");
    const html = await res.text();

    nav.innerHTML = html;
    nav.style.display = "block";

    applyDarkModeState();

    const h = document.getElementById("hamburger");
    if (h) {
        h.addEventListener("click", () => {
            const m = document.getElementById("mobileMenu");
            m.classList.toggle("open");
        });
    }

    const desktopBtn = document.getElementById("darkToggleDesktop");
    const mobileBtn = document.getElementById("darkToggleMobile");

    if (desktopBtn) desktopBtn.onclick = toggleDark;
    if (mobileBtn) mobileBtn.onclick = toggleDark;

    updateCartBadgeBackend();
}

async function updateCartBadgeBackend() {
    const desktopEl = document.getElementById("cartCountDesktop");
    const mobileEl = document.getElementById("cartCount");

    const res = await fetch("/api/cart", { credentials: "include" });
    if (!res.ok) {
        if (desktopEl) desktopEl.textContent = 0;
        if (mobileEl) mobileEl.textContent = 0;
        return;
    }

    const cart = await res.json();
    const count = cart.length;

    if (desktopEl) desktopEl.textContent = count;
    if (mobileEl) mobileEl.textContent = count;
}

async function loadCart() {
    const res = await fetch("/api/cart", { credentials: "include" });
    const items = await res.json();

    const container = document.getElementById("cartItems");
    const totalEl = document.getElementById("total");
    const checkoutBtn = document.getElementById("checkoutBtn");

    container.innerHTML = "";

    if (items.length === 0) {
        container.innerHTML = `<div class="empty">Your cart is empty</div>`;
        totalEl.textContent = "";
        checkoutBtn.style.display = "none";
        return;
    }

    checkoutBtn.style.display = "block";

    let total = 0;

    for (const item of items) {
        const listingRes = await fetch(`/api/listings/${item.listingId}`, {
            credentials: "include"
        });
        const listing = await listingRes.json();

        total += listing.price;

        const div = document.createElement("div");
        div.className = "cart-item";

        const img = listing.images.length > 0 ? listing.images[0].imageUrl : "";

        div.innerHTML = `
            <img src="${img}">
            <div class="item-info">
                <div class="item-title">${listing.title}</div>
                <div class="item-price">£${listing.price}</div>
            </div>
            <button class="remove-btn" onclick="removeItem(${item.listingId})">Remove</button>
        `;

        container.appendChild(div);
    }

    totalEl.textContent = "Total: £" + total;
    updateCartBadgeBackend();
}

async function removeItem(listingId) {
    await fetch(`/api/cart/remove/${listingId}`, {
        method: "DELETE",
        credentials: "include"
    });

    updateCartBadgeBackend();
    loadCart();
}

async function checkout() {
    const fullName = document.getElementById("fullName").value;
    const line1 = document.getElementById("line1").value;
    const line2 = document.getElementById("line2").value;
    const city = document.getElementById("city").value;
    const postcode = document.getElementById("postcode").value;

    const address = `${fullName}, ${line1}${line2 ? ", " + line2 : ""}, ${city}, ${postcode}`;

    await fetch("/api/orders/checkout", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ address })
    });

    updateCartBadgeBackend();
    loadCart();
}

loadNavbar();
loadCart();
</script>

</body>
</html>
