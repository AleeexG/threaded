        <button id = "darkModeToggle" class = "darkModeToggle"> 🌙 Night </button>

        <script>
            const buttons = document.querySelectorAll('#darkModeToggle, .darkModeToggle');
            let isNight = true;
            for (let i = 0; i < buttons.length; i++) {
            buttons[i].addEventListener('click', function () {
                if (isNight){
                    isNight = false
                }else {
                    isNight = true
                }
                
                if (isNight) {
                    document.body.classList.add('dark-mode');
                } else {
                    document.body.classList.remove('dark-mode');
                }

                for (let j = 0; j < buttons.length; j++) {
                    if (isNight) {
                        buttons[j].textContent = '🌙 Night';
                    } else {
                        buttons[j].textContent = '☀️ Day';
                    }
                }
            });
        }
            </script>
