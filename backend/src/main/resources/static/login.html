<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: black;
        }

        .title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        .login-box {
            background: white;
            width: 100%;
            max-width: 360px;
            padding: 20px;
            border-radius: 12px;
            border: 3px solid #ff7ebf;
            box-sizing: border-box;
            text-align: center;
        }

        .login-box h2 {
            margin-bottom: 18px;
            font-size: 20px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            border: 2px solid black;
            font-size: 14px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            border-radius: 8px;
            border: 2px solid black;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            color: black;
            background: #ff7ebf;
        }

        #register-btn {
            background: black;
            color: white;
        }

        #login-btn:hover {
            background: #ff9ad0;
        }

        #register-btn:hover {
            background: #333;
        }

        .error {
            color: red;
            margin-top: 10px;
        }

        .success {
            color: green;
            margin-top: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #ff7ebf;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            color: #ff7ebf;
            font-weight: 600;
        }

        .forgot-link {
            margin-top: 10px;
            text-align: center;
            color: #ff7ebf;
            font-weight: 700;
            cursor: pointer;
        }

        .help-modal {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .help-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 3px solid #ff7ebf;
            width: 300px;
            text-align: center;
        }

        .help-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .help-option {
            flex: 1;
            padding: 10px;
            border: 2px solid black;
            background: #eee;
            cursor: pointer;
            font-weight: 700;
        }

        .help-option.active {
            background: #ff7ebf;
            color: black;
        }
    </style>
</head>
<body>

<div class="title">THREADED</div>

<div class="login-box">
    <h2>Login</h2>

    <input id="username" type="text" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button id="login-btn">Login</button>
    <button id="register-btn">Create Account</button>

    <p class="forgot-link" onclick="document.getElementById('helpModal').style.display='flex'">Need help logging in?</p>

    <div id="message"></div>
</div>

<div id="helpModal" class="help-modal">
    <div class="help-box">
        <h3>Need help?</h3>

        <div class="help-toggle">
            <button id="forgotPasswordBtn" class="help-option active">Forgot Password</button>
            <button id="forgotUsernameBtn" class="help-option">Forgot Username</button>
        </div>

        <input id="helpEmail" type="email" placeholder="Enter your email">

        <button id="helpSubmit">Submit</button>
    </div>
</div>

<script>
    const msg = document.getElementById("message");

    function show(text, type="error") {
        msg.textContent = text;
        msg.className = type;
    }

    document.getElementById("register-btn").onclick = () => {
        window.location.href = "register.html";
    };

    document.getElementById("login-btn").onclick = async () => {
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        msg.innerHTML = `<span class="spinner"></span><span class="loading-text">Loading...</span>`;

        const res = await fetch("/api/auth/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!data.success) {
            show(data.message, "error");
            return;
        }

        if (data.data === true) {
            window.location.href = "twofactor.html?username=" + encodeURIComponent(username);
            return;
        }

        show("Login successful!", "success");

        setTimeout(() => window.location.href = "home.html", 800);
    };

    let helpMode = "password";

    document.getElementById("forgotPasswordBtn").onclick = () => {
        helpMode = "password";
        document.getElementById("forgotPasswordBtn").classList.add("active");
        document.getElementById("forgotUsernameBtn").classList.remove("active");
    };

    document.getElementById("forgotUsernameBtn").onclick = () => {
        helpMode = "username";
        document.getElementById("forgotUsernameBtn").classList.add("active");
        document.getElementById("forgotPasswordBtn").classList.remove("active");
    };

    document.getElementById("helpSubmit").onclick = async () => {
        const email = document.getElementById("helpEmail").value.trim();
        if (!email) return;

        const endpoint = helpMode === "password"
            ? "/api/auth/forgot-password"
            : "/api/auth/forgot-username";

        await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email })
        });

        document.getElementById("helpModal").style.display = "none";
    };

    document.addEventListener("click", e => {
        const modal = document.getElementById("helpModal");
        const box = document.querySelector(".help-box");

        if (e.target.classList.contains("forgot-link")) return;

        if (modal.style.display !== "none" && !box.contains(e.target)) {
            modal.style.display = "none";
        }
    });
</script>

</body>
</html>
