<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Orders</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #fafafa;
            margin: 0;
            padding: 0;
            color: black;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            border: 3px solid #ff7ebf;
            box-shadow: 0 0 10px rgba(0,0,0,0.15);
        }
        h2 {
            margin-top: 0;
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 25px;
        }
        .order {
            display: flex;
            align-items: center;
            border: 2px solid black;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f7f7f7;
        }
        .order img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid black;
            margin-right: 20px;
        }
        .details {
            flex: 1;
        }
        .details h3 {
            margin: 0;
            font-size: 22px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: underline;
        }
        .details p {
            margin: 6px 0;
            font-size: 16px;
        }
        .status {
            font-weight: 700;
            margin-top: 6px;
        }
        .btn {
            padding: 10px 14px;
            border-radius: 8px;
            border: 2px solid black;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }
        .ship-btn {
            background: #ff7ebf;
        }
        .receive-btn {
            background: #ffe066;
        }
        .rate-btn {
            background: #ff7ebf;
        }
        .empty {
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            margin-top: 40px;
        }
        #ratingModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
        }
        #ratingBox {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 3px solid #ff7ebf;
            width: 350px;
        }
        #ratingBox h3 {
            margin-top: 0;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
        }
        #ratingBox textarea {
            width: 100%;
            height: 90px;
            border: 2px solid black;
            border-radius: 8px;
            padding: 8px;
            font-family: Poppins, sans-serif;
            font-size: 16px;
        }
        .stars {
            text-align: center;
            font-size: 32px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .stars span {
            padding: 4px;
        }
        #submitRating {
            width: 100%;
            margin-top: 12px;
            background: #ff7ebf;
            border: 2px solid black;
            padding: 10px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
        }
    </style>
    <link rel="stylesheet" href="/responsive.css">

</head>
<body>

<div id="navbar"></div>

<script>
async function updateCartCount() {
    const desktopEl = document.getElementById("cartCountDesktop");
    const mobileEl = document.getElementById("cartCount");

    const res = await fetch("/api/cart", { credentials: "include" });
    if (!res.ok) {
        if (desktopEl) desktopEl.textContent = 0;
        if (mobileEl) mobileEl.textContent = 0;
        return;
    }

    const cart = await res.json();
    const count = cart.length;

    if (desktopEl) desktopEl.textContent = count;
    if (mobileEl) mobileEl.textContent = count;
}
</script>

<script>
let dark = localStorage.getItem("darkMode") === "true";

function applyDarkModeState() {
    document.body.classList.toggle("dark-mode", dark);
    updateIcons(dark);
}

function updateIcons(isDark) {
    const desktopIcon = document.getElementById("desktopIcon");
    const mobileIcon = document.getElementById("mobileIcon");
    const desktopText = document.querySelector("#darkToggleDesktop span");

    if (!desktopIcon || !mobileIcon || !desktopText) return;

    if (isDark) {
        desktopIcon.innerHTML =
            '<path d="M12 4V2M12 22v-2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12H4M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/><circle cx="12" cy="12" r="5"/>';
        mobileIcon.innerHTML = desktopIcon.innerHTML;
        desktopText.textContent = "Day";
    } else {
        desktopIcon.innerHTML =
            '<path d="M21 12.79A9 9 0 0111.21 3 7 7 0 1019 14.79z"/>';
        mobileIcon.innerHTML = desktopIcon.innerHTML;
        desktopText.textContent = "Night";
    }
}

function toggleDark() {
    dark = !dark;
    localStorage.setItem("darkMode", dark);
    applyDarkModeState();
}

fetch("/navbar.html")
    .then(res => res.text())
    .then(html => {
        const nav = document.getElementById("navbar");
        nav.innerHTML = html;
        nav.style.display = "block";

        applyDarkModeState();

        const h = document.getElementById("hamburger");
        if (h) {
            h.addEventListener("click", () => {
                const m = document.getElementById("mobileMenu");
                m.classList.toggle("open");
            });
        }

        const desktopBtn = document.getElementById("darkToggleDesktop");
        const mobileBtn = document.getElementById("darkToggleMobile");

        if (desktopBtn) desktopBtn.onclick = toggleDark;
        if (mobileBtn) mobileBtn.onclick = toggleDark;

        updateCartCount();
    });
</script>

<div class="container">
    <h2>My Orders</h2>
    <div id="orders"></div>
</div>

<div id="ratingModal">
    <div id="ratingBox">
        <h3>Rate Seller</h3>
        <div class="stars" id="starContainer">
            <span data-s="1">★</span>
            <span data-s="2">★</span>
            <span data-s="3">★</span>
            <span data-s="4">★</span>
            <span data-s="5">★</span>
        </div>
        <textarea id="reviewText" placeholder="Optional review"></textarea>
        <button id="submitRating">Submit Rating</button>
    </div>
</div>

<script>
let currentUserId = null;
let selectedStars = 0;
let ratingOrderId = null;

async function loadUser() {
    const res = await fetch("/api/session/me", { credentials: "include" });
    if (!res.ok) return;
    const data = await res.json();
    currentUserId = data.id;
}

async function loadOrders() {
    await loadUser();

    const res = await fetch("/api/orders/me", {
        credentials: "include"
    });

    const data = await res.json();
    const container = document.getElementById("orders");
    container.innerHTML = "";

    if (!data.success || data.data.length === 0) {
        container.innerHTML = "<div class='empty'>You haven't bought anything yet.</div>";
        return;
    }

    data.data.forEach(order => {
        const div = document.createElement("div");
        div.className = "order";

        let actionButton = "";

        if (order.status === "PAID" && order.sellerId === currentUserId) {
            actionButton = `<button class="btn ship-btn" onclick="markShipped(${order.id})">Mark as Shipped</button>`;
        }

        if (order.status === "SHIPPED" && order.buyerId === currentUserId) {
            actionButton = `<button class="btn receive-btn" onclick="markReceived(${order.id})">Mark as Received</button>`;
        }

        if (order.status === "RECEIVED" && order.buyerId === currentUserId && !order.rated) {
            actionButton = `<button class="btn rate-btn" onclick="openRating(${order.id})">Rate Seller</button>`;
        }

        div.innerHTML = `
            <img src="${order.mainImageUrl}" alt="Listing">
            <div class="details">
                <h3 onclick="openListing(${order.listingId}, ${order.id})">${order.title}</h3>
                <p><strong>Price:</strong> £${order.priceAtPurchase}</p>
                <p><strong>Seller:</strong> ${order.sellerUsername}</p>
                <p><strong>Date:</strong> ${new Date(order.createdAt).toLocaleDateString()}</p>
                <p><strong>Address:</strong> ${order.address}</p>
                <p class="status"><strong>Status:</strong> ${order.status}</p>
                ${actionButton}
            </div>
        `;

        container.appendChild(div);
    });
}

function openListing(listingId, orderId) {
    window.location.href = `listing.html?id=${listingId}&fromOrders=true&orderId=${orderId}`;
}

async function markShipped(orderId) {
    await fetch(`/api/orders/${orderId}/ship`, {
        method: "POST",
        credentials: "include"
    });
    loadOrders();
}

async function markReceived(orderId) {
    await fetch(`/api/orders/${orderId}/receive`, {
        method: "POST",
        credentials: "include"
    });
    loadOrders();
}

function openRating(orderId) {
    ratingOrderId = orderId;
    selectedStars = 0;
    document.getElementById("reviewText").value = "";
    document.getElementById("ratingModal").style.display = "flex";
    highlightStars(0);
}

function highlightStars(n) {
    document.querySelectorAll("#starContainer span").forEach(s => {
        const val = parseInt(s.getAttribute("data-s"));
        s.style.color = val <= n ? "#ff7ebf" : "#ccc";
    });
}

document.querySelectorAll("#starContainer span").forEach(s => {
    s.onclick = () => {
        selectedStars = parseInt(s.getAttribute("data-s"));
        highlightStars(selectedStars);
    };
});

document.getElementById("submitRating").onclick = async () => {
    if (selectedStars === 0) return;

    const review = document.getElementById("reviewText").value;

    await fetch(`/api/ratings/${ratingOrderId}?score=${selectedStars}&review=${encodeURIComponent(review)}`, {
        method: "POST",
        credentials: "include"
    });

    document.getElementById("ratingModal").style.display = "none";
    loadOrders();
};

loadOrders();
</script>

</body>
</html>
